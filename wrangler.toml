name = "stcatharinesdigital"
pages_build_output_dir = "dist"

# Cloudflare Pages Cron Triggers (Wrangler 4.x Pages-compatible)
# Functions in /functions/cron/* are invoked by Cloudflare when the schedule matches.
# The [[trigger]] section maps a cron schedule to a function path.
# Local news RSS fetcher — every 6 hours (0,6,12,18 UTC) = 7am/1pm/7pm/1am ET
[[trigger]]
function = "cron/fetch-local-news"
schedule = "0 0,6,12,18 * * *"

# PRE-PRODUCTION DIRECTIVE — set CRON_SECRET before enabling in dashboard.
# The /functions/cron/* handlers require an Authorization: Bearer <CRON_SECRET>.
# If CRON_SECRET is unset in Pages Environment Variables, the cron functions return 503.

[[d1_databases]]
binding = "STC_D1"
database_name = "stcatharinesdigital_d1"
database_id = "58b9ee2e-c86a-4469-8729-f71ce89e6326"

[ai]
binding = "AI"