name: CI Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}
  ARCHIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: ci-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Parallel quality suites. Unit tests run on Node 22 only (production runtime);
  # jsdom 30 / undici require Node 22+ (markAsUncloneable).
  test:
    name: ${{ matrix.suite }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            suite: unit
            command: npm test
          - node-version: 22
            suite: critical-logic-coverage
            command: npm run test:coverage
          - node-version: 22
            suite: collector
            command: node --test scripts/*.regression.mjs
          - node-version: 22
            suite: content-audit
            command: npm run content:audit
          # Fails when a tracked document states a count the data does not support.
          - node-version: 22
            suite: metrics-audit
            command: npm run audit:metrics
          # Fails when a customer-facing address differs from siteConfig.email.
          - node-version: 22
            suite: identity-audit
            command: npm run audit:identity
          # Salvaged from the computerexpress-darius-site WU-006 work unit, which
          # this branch never received — the project had no linter or type check.
          - node-version: 22
            suite: lint
            command: npm run lint
          - node-version: 22
            suite: type-check
            command: npm run typecheck
          - node-version: 22
            suite: workflow-policy
            command: npm run audit:workflows
          - node-version: 22
            suite: archive-retention
            command: npm run audit:archives

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.command }}

  # Build with the supported production runtime; tooling requires Node 22+.
  build:
    name: build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Production build
        run: npm run build

      - name: Verify release files and prerendered pages
        run: npm run audit:build

      - name: Report homepage bundle budget
        run: npm run budget:bundle

      # A route that renders an empty shell still exits 0 from the build.
      - name: Verify prerendered output
        run: npm run verify:prerender

      - name: Upload dist artifact (Node 22 only)
        if: matrix.node-version == 22
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-node22
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  browser:
    name: Browser journeys passed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Download the exact tested build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist-node22
          path: dist
      - name: Revalidate the downloaded release
        run: npm run audit:build
      - name: Install Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify responsive reader journeys and local chat
        run: |
          npm run audit:visual
          npm run test:browser
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-browser-results
          path: |
            artifacts/visual/
            artifacts/browser/
            artifacts/local-chat/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # Advisory only. The monetization score is a heuristic dashboard — it must be
  # visible on every run but must never block a deploy.
  monetization-report:
    name: monetization report (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-project
        with:
          node-version: 22

      - name: Report monetization readiness
        run: npm run audit:monetization

  # Single green check for branch protection rules
  ci-success:
    name: CI matrix passed
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [test, build, browser]
    if: always()
    steps:
      - name: Aggregate matrix results
        run: |
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::One or more matrix jobs failed"
            exit 1
          fi
          echo "All matrix jobs passed"
