name: Content integrity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: collector-regression
            command: node --test scripts/*.regression.mjs
          - suite: content-audit
            command: npm run content:audit
          - suite: schema-audit
            command: npm run build && node scripts/audit-schema.js

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000

      - name: ${{ matrix.suite }}
        run: ${{ matrix.command }}

  integrity-passed:
    name: Content integrity passed
    runs-on: ubuntu-24.04
    needs: integrity
    if: always()
    steps:
      - name: Aggregate suite results
        run: |
          if [ "${{ needs.integrity.result }}" != "success" ]; then
            echo "::error::Content integrity matrix failed"
            exit 1
          fi
          echo "All content integrity suites passed"
