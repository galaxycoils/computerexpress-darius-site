name: Content integrity

# Structured data is audited in CI's production build and again before
# publication. This workflow keeps the source, archive and collector gates,
# including the daily run when no code has changed.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}
  ARCHIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: content-integrity-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  integrity:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: collector-regression
            command: node --test scripts/*.regression.mjs
          - suite: content-audit
            command: npm run content:audit
          - suite: archive-retention
            command: npm run audit:archives

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-project
        with:
          node-version: 22

      - name: ${{ matrix.suite }}
        run: ${{ matrix.command }}

  integrity-passed:
    name: Content integrity passed
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: integrity
    if: always()
    steps:
      - name: Aggregate suite results
        run: |
          if [ "${{ needs.integrity.result }}" != "success" ]; then
            echo "::error::Content integrity matrix failed"
            exit 1
          fi
          echo "All content integrity suites passed"
