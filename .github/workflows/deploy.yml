name: Deploy to Cloudflare Pages

on:
  # Human and bot pushes to main (bot GITHUB_TOKEN pushes do not re-trigger workflows)
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  # Manual production deploy
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run
        required: false
        default: manual
        type: string
  # Autonomous news collect commits with GITHUB_TOKEN, which does not fire push workflows.
  # Re-run deploy after a successful collect so discovery.json reaches production.
  workflow_run:
    workflows:
      - Collect official sources (autonomous)
    types:
      - completed

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip failed collect runs; always run on push / manual dispatch
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # For workflow_run, check out the commit that finished collect (usually main tip)
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Content audit
        run: npm run content:audit

      - name: Application tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) secret"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID secret not set; using workflow fallback account id"
          fi

      - name: Configure signed alert-token runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a55a43856c7029505b79300ec82f1629' }}
          ALERT_TOKEN_SECRET: ${{ secrets.ALERT_TOKEN_SECRET }}
        run: |
          if [ -z "$ALERT_TOKEN_SECRET" ]; then
            echo "::warning::ALERT_TOKEN_SECRET is not configured; planning-alert signup and management remain unavailable."
          else
            printf '%s' "$ALERT_TOKEN_SECRET" | npx wrangler pages secret put ALERT_TOKEN_SECRET --project-name=stcatharinesdigital
          fi

      - name: Configure AgentMail runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a55a43856c7029505b79300ec82f1629' }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          if [ -z "$AGENTMAIL_API_KEY" ]; then
            echo "AGENTMAIL_API_KEY is not configured; contact form will use fallback delivery."
            exit 0
          fi
          printf '%s' "$AGENTMAIL_API_KEY" | npx wrangler pages secret put AGENTMAIL_API_KEY --project-name=stcatharinesdigital

      - name: Apply newsletter and delivery schemas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a55a43856c7029505b79300ec82f1629' }}
        run: |
          npx wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0005_create_newsletter_subscribers.sql --yes
          npx wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0006_create_email_delivery_log.sql --yes

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a55a43856c7029505b79300ec82f1629' }}
          command: pages deploy dist --project-name=stcatharinesdigital --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Cloudflare edge cache
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::Skipping cache purge (need CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID)"
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo
          echo "Edge cache purge requested for zone ${CF_ZONE_ID}"
