name: Deploy to Cloudflare Pages
run-name: Deploy ${{ inputs.publication_sha || github.sha }} / ${{ inputs.reason || 'automatic' }}

on:
  # Refresh prerendered dates for readers and crawlers even when no content changed.
  schedule:
    - cron: "15 5 * * *"
  # Human pushes to main
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "LICENSE*"
  # Manual production deploy, including dispatch after a collector commit
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run
        required: false
        default: manual
        type: string

      publication_sha:
        description: Exact post-collection revision (blank deploys the dispatch revision)
        required: false
        type: string

      rendered_at:
        description: Frozen publication timestamp from the collector build
        required: false
        type: string

  workflow_call:
    inputs:
      reason:
        required: false
        default: reusable-deploy
        type: string
      publication_sha:
        required: false
        type: string
      rendered_at:
        required: false
        type: string

env:
  VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}
  SCD_RENDER_NOW: ${{ inputs.rendered_at }}

concurrency:
  group: deploy-cloudflare-pages
  # Keep an earlier release from completing after a newer publication has started.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publication_sha || github.sha }}
          fetch-depth: 0

      - name: Verify release belongs to main
        env:
          REQUESTED_SHA: ${{ inputs.publication_sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ] && ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid publication revision"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Record release revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000

      - name: Collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Content audit
        run: npm run content:audit

      - name: Application tests
        run: npm test

      - name: Critical logic coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Report homepage bundle budget
        run: npm run budget:bundle

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) secret"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

      - name: Configure signed alert-token runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_TOKEN_SECRET: ${{ secrets.ALERT_TOKEN_SECRET }}
        run: |
          if [ -z "$ALERT_TOKEN_SECRET" ]; then
            echo "::warning::ALERT_TOKEN_SECRET is not configured; planning-alert signup and management remain unavailable."
          else
            printf '%s' "$ALERT_TOKEN_SECRET" | npx --no-install wrangler pages secret put ALERT_TOKEN_SECRET --project-name=stcatharinesdigital
          fi

      - name: Configure AgentMail runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          if [ -z "$AGENTMAIL_API_KEY" ]; then
            echo "AGENTMAIL_API_KEY is not configured; contact form will use fallback delivery."
            exit 0
          fi
          printf '%s' "$AGENTMAIL_API_KEY" | npx --no-install wrangler pages secret put AGENTMAIL_API_KEY --project-name=stcatharinesdigital

      - name: Configure editorial access secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDITORIAL_ADMIN_TOKEN: ${{ secrets.EDITORIAL_ADMIN_TOKEN }}
          EDITORIAL_REVIEWER_TOKEN: ${{ secrets.EDITORIAL_REVIEWER_TOKEN }}
          EDITORIAL_USERS_JSON: ${{ secrets.EDITORIAL_USERS_JSON }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$EDITORIAL_ADMIN_TOKEN" ] && [ -z "$EDITORIAL_USERS_JSON" ]; then
            echo "::warning::Editorial credentials are not configured; the editorial desk remains locked."
          fi
          if [ -n "$EDITORIAL_ADMIN_TOKEN" ]; then
            printf '%s' "$EDITORIAL_ADMIN_TOKEN" | npx --no-install wrangler pages secret put EDITORIAL_ADMIN_TOKEN --project-name=stcatharinesdigital
          fi
          if [ -n "$EDITORIAL_REVIEWER_TOKEN" ]; then
            printf '%s' "$EDITORIAL_REVIEWER_TOKEN" | npx --no-install wrangler pages secret put EDITORIAL_REVIEWER_TOKEN --project-name=stcatharinesdigital
          fi
          if [ -n "$EDITORIAL_USERS_JSON" ]; then
            printf '%s' "$EDITORIAL_USERS_JSON" | npx --no-install wrangler pages secret put EDITORIAL_USERS_JSON --project-name=stcatharinesdigital
          fi
          if [ -n "$CRON_SECRET" ]; then
            printf '%s' "$CRON_SECRET" | npx --no-install wrangler pages secret put CRON_SECRET --project-name=stcatharinesdigital
          fi

      - name: Apply newsletter and delivery schemas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0005_create_newsletter_subscribers.sql --yes
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0006_create_email_delivery_log.sql --yes
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0007_newsletter_tokens.sql --yes
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0008_editorial_submissions.sql --yes
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0009_editorial_audit.sql --yes
          npx --no-install wrangler d1 execute stcatharinesdigital_d1 --remote --file=./migrations/0010_alert_sent_items.sql --yes

      - name: Skip superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch origin main
          latest=$(git rev-parse FETCH_HEAD)
          if [ "$latest" = "$RELEASE_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision superseded this build.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.current.outputs.publish == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.148.0"
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stcatharinesdigital --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Cloudflare edge cache
        id: purge
        if: success() && steps.current.outputs.publish == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::Skipping cache purge (need CF_API_TOKEN and CLOUDFLARE_ZONE_ID)"
            exit 0
          fi
          curl --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 30 -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --fail --show-error --silent \
            --data '{"purge_everything":true}' > purge-response.json
          if ! jq -e '.success == true' purge-response.json >/dev/null; then
            echo "::error::Cloudflare rejected the cache purge request"
            jq -c '{errors, messages}' purge-response.json
            exit 1
          fi
          echo "Edge cache purge requested for zone ${CF_ZONE_ID}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Verify live revision and public pages
        if: steps.current.outputs.publish == 'true'
        run: node scripts/verify-release.js

      - name: Deploy summary
        if: always()
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha || github.sha }}
          TRIGGER: ${{ github.event_name }}
          CACHE_PURGE: ${{ steps.purge.outputs.enabled || 'skipped' }}
        run: |
          {
            echo "### Deploy summary"
            echo "| Field | Value |"
            echo "|-------|-------|"
            printf '| Commit | %s |\n' "$RELEASE_SHA"
            printf '| Trigger | %s |\n' "$TRIGGER"
            echo "| Project | stcatharinesdigital |"
            printf '| Cache purge | %s |\n' "$CACHE_PURGE"
          } >> "$GITHUB_STEP_SUMMARY"
