name: Send verified planning digest

on:
  schedule:
    # 6 AM Toronto falls at 10 or 11 UTC depending on daylight saving.
    - cron: '0 10,11 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: planning-digest
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Select the weekly delivery window
        id: schedule
        env:
          TRIGGER: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-digest-schedule.mjs
      - name: Submit planning digest
        if: steps.schedule.outputs.send == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::CRON_SECRET is missing. Configure it for both the scheduler and Pages deployment.'
            exit 1
          fi
          if ! curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 720 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST 'https://stcatharinesdigital.ca/cron/daily-digest' \
            --output "$RUNNER_TEMP/digest-result.json"; then
            # Print only a known stage and an allowlisted reason, never provider responses or recipient data.
            jq -r 'select(.error == "digest_failed") | .stage as $stage | .reason as $reason | select($stage == "provider_inbox" or $stage == "planning_feed" or $stage == "recipient_query" or $stage == "grace_notices" or $stage == "deliveries") | ["inbox_unreachable","feed_unreachable","feed_unavailable","feed_redirect","feed_unreadable","feed_invalid","query_failed","delivery_failed"] as $allowed | if ($allowed | index($reason)) then "::error::Digest failed at stage: " + $stage + " (" + $reason + ")" else "::error::Digest failed at stage: " + $stage end' "$RUNNER_TEMP/digest-result.json" 2>/dev/null || true
            echo '::error::Digest request failed. Inspect delivery records before retrying.'
            exit 1
          fi
          if ! jq -e '.failed == 0 and (.sent | type == "number") and (.total | type == "number")' "$RUNNER_TEMP/digest-result.json" >/dev/null; then
            echo '::error::Digest did not complete successfully. Inspect delivery records before retrying to avoid duplicate messages.'
            exit 1
          fi
          jq '{sent, failed, total}' "$RUNNER_TEMP/digest-result.json"
