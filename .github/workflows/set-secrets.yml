name: Set Cloudflare Pages Secrets

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Set AGENTMAIL_API_KEY secret
        run: |
          echo "am_us_3b49fc3003288e0001d868a64d5ba29919f3f04512627ac1686115ac857af1cf" | \
          wrangler pages secret put AGENTMAIL_API_KEY \
            --project-name=computerexpress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a55a43856c7029505b79300ec82f1629
