name: Set Cloudflare Pages Secrets

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set AGENTMAIL_API_KEY on Cloudflare Pages
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/a55a43856c7029505b79300ec82f1629/pages/projects/computerexpress/environment-variables" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"deployment_configs":{"production":{"env_vars":{"AGENTMAIL_API_KEY":"am_us_3b49fc3003288e0001d868a64d5ba29919f3f04512627ac1686115ac857af1cf"}}}}'
