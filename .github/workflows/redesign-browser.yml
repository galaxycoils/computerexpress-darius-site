name: Redesign browser verification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'scripts/browser-redesign.mjs'
      - 'scripts/prerender.js'
      - 'scripts/prepare-local-images.mjs'
      - 'package*.json'
      - '.github/workflows/redesign-browser.yml'
      - 'scripts/audit-visual.js'
      - 'scripts/playwright-visual.config.mjs'
      - 'scripts/browser-local-chat.mjs'
      - '.github/actions/**'
  push:
    branches: [main, "redesign/**"]
  workflow_dispatch:
concurrency:
  group: browser-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:coverage
      - run: node --test scripts/*.regression.mjs
      - run: npm run content:audit
      - run: npm run build
      - run: npm run audit:build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify responsive pages and hydration
        run: npm run audit:visual
      - name: Verify reader journeys
        run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: redesign-browser-results
          path: |
            artifacts/visual/
            artifacts/browser/
            artifacts/local-chat/
            test-results/
          retention-days: 14
