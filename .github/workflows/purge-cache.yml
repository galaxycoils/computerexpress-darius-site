name: Purge Cloudflare Cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache for production host
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CF_API_TOKEN"
            exit 1
          fi
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ZONE_ID secret (zone for stcatharinesdigital.ca)"
            exit 1
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo
          echo "Purge requested for zone ${CF_ZONE_ID}"
