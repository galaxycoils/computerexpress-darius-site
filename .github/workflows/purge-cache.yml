name: Purge Cloudflare Cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cache-purge
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Purge Cloudflare cache for production host
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CF_API_TOKEN"
            exit 1
          fi
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ZONE_ID secret (zone for stcatharinesdigital.ca)"
            exit 1
          fi
          response=$(curl --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 30 --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if ! jq -e '.success == true' <<<"$response" >/dev/null; then
            echo "::error::Cloudflare rejected the cache purge request"
            jq -c '{errors, messages}' <<<"$response"
            exit 1
          fi
          echo "Purge requested for zone ${CF_ZONE_ID}"
