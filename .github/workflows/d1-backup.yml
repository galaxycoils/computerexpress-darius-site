name: Encrypted D1 backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export and encrypt D1 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_BACKUP_PASSPHRASE"
          mkdir -p backup
          npx wrangler d1 export stcatharinesdigital_d1 --remote --output backup/stcatharinesdigital.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup/stcatharinesdigital.sql -out backup/stcatharinesdigital.sql.enc -pass env:D1_BACKUP_PASSPHRASE
          rm backup/stcatharinesdigital.sql
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-d1-backup
          path: backup/stcatharinesdigital.sql.enc
          retention-days: 30
