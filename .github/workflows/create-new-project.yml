name: Ensure Cloudflare Pages Project

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: pages-project-setup
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  create-project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          node-version: 22
      - name: Create the project only when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare API token and account ID are required.'
            exit 1
          fi
          status=$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$RUNNER_TEMP/pages-project.json" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stcatharinesdigital")
          if [ "$status" = 200 ]; then
            jq -e '.success == true and .result.name == "stcatharinesdigital"' "$RUNNER_TEMP/pages-project.json" >/dev/null
            echo 'Existing Pages project retained.'
          elif [ "$status" = 404 ]; then
            npx --no-install wrangler pages project create stcatharinesdigital --production-branch=main
          else
            echo "::error::Unable to check Pages project (HTTP $status)."
            exit 1
          fi

  deploy:
    needs: create-project
    uses: ./.github/workflows/deploy.yml
    with:
      reason: manual-project-setup
    secrets: inherit
