name: Collect official sources (autonomous)

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-official-news.js
      - scripts/watch-workflow.js
      - scripts/workflowWatcher.js
      - scripts/publish-candidate.js
      - scripts/candidatePublication.js
      - src/data/sourceRegistry.js
      - .github/workflows/collect-official-news.yml
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Approved source ID, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch without proposing a publication
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODE: ${{ github.event_name == 'schedule' && 'write' || (inputs.dry_run && 'dry-run' || 'write') }}
      SOURCE: ${{ inputs.source || 'all' }}
      GH_TOKEN: ${{ github.token }}
      VITE_HOMEPAGE_LEAD_SLUG: ${{ vars.VITE_HOMEPAGE_LEAD_SLUG }}

    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000

      - name: Collect from approved official sources
        shell: bash
        run: |
          args=(--dry-run)
          if [ "$MODE" = "write" ]; then
            args=(--write)
          fi
          if [ "$SOURCE" != "all" ]; then
            args+=(--source "$SOURCE")
          fi
          npm run content:collect -- "${args[@]}"

      - name: Run content integrity audit
        run: npm run content:audit

      - name: Run collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Validate application before publication
        if: env.MODE == 'write'
        run: |
          npm test
          npm run build
          npm run audit:build
          npm run audit:schema

      - name: Detect discovery changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated/discovery.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify candidate before publishing discovery update
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stcatharinesdigital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/discovery.json
          git commit -m "news: autonomous official-source refresh $(date -u +%Y-%m-%d)"
          built_base=$(git rev-parse HEAD^)
          published=false
          branch=''
          cleanup_branch() {
            if [ -n "$branch" ]; then
              git push origin --delete "$branch" || echo "::warning::Could not remove owned candidate branch $branch"
              branch=''
            fi
          }
          cleanup() {
            result=$?
            trap - EXIT
            cleanup_branch
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          validate_candidate() {
            npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000
            npm run content:audit
            npm test
            npm run build
            npm run audit:build
            npm run audit:schema
          }
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              # Generated data can conflict with a newer collection. Recollect on
              # the new base rather than selecting an entire side of the conflict.
              git switch --detach origin/main
              args=(--write)
              if [ "$SOURCE" != all ]; then args+=(--source "$SOURCE"); fi
              npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000
              npm run content:collect -- "${args[@]}"
              validate_candidate
              git add src/data/generated/discovery.json
              if git diff --cached --quiet; then
                published=true
                break
              fi
              git commit -m "news: recollect official sources after concurrent update $(date -u +%Y-%m-%d)"
              built_base=''
            fi
            current_base=$(git rev-parse HEAD^)
            if [ "$current_base" != "$built_base" ]; then
              validate_candidate
              built_base="$current_base"
            else
              # Release metadata must identify the committed candidate, not its parent.
              npm run build
              npm run audit:build
              npm run audit:schema
            fi
            branch="news/official-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            candidate=$(git rev-parse HEAD)
            git push origin "$candidate:refs/heads/$branch"
            dispatched_at=$(date -u +%FT%TZ)
            for workflow in ci.yml content-integrity.yml; do
              gh workflow run "$workflow" --ref "$branch"
            done
            for workflow in ci.yml content-integrity.yml; do
              node scripts/watch-workflow.js --workflow "$workflow" --branch "$branch" \
                --sha "$candidate" --since "$dispatched_at"
            done
            if node scripts/publish-candidate.js "$current_base" "$candidate"; then
              published=true
              cleanup_branch
              break
            else
              result=$?
              if [ "$result" != 2 ]; then exit "$result"; fi
            fi
            cleanup_branch
          done
          if [ "$published" != true ]; then
            echo '::error::Main kept advancing during candidate validation.'
            exit 1
          fi

      - name: Ensure the latest snapshot is public
        if: env.MODE == 'write'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in 1 2 3; do
            git fetch origin main
            revision=$(git rev-parse origin/main)
            built_revision=$(jq -er '.sha' dist/release.json)
            if [ "$(git rev-parse HEAD)" != "$revision" ] || [ "$built_revision" != "$revision" ]; then
              git switch --detach "$revision"
              npm ci --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000
              npm run content:audit
              npm test
              npm run build
              npm run audit:build
              npm run audit:schema
            fi
            # Repair a prior failed deployment, including a stale content snapshot.
            expected_snapshot=$(jq -er '.snapshotHash' dist/release.json)
            live_release=$(curl --fail --silent --show-error --max-time 20 "https://stcatharinesdigital.ca/release.json?collector=$GITHUB_RUN_ID&attempt=$attempt") || live_release='{}'
            live_sha=$(jq -r '.sha // empty' <<< "$live_release") || live_sha=''
            live_snapshot=$(jq -r '.snapshotHash // empty' <<< "$live_release") || live_snapshot=''
            live_rendered_at=$(jq -r '.renderedAt // empty' <<< "$live_release") || live_rendered_at=''
            if ! node -e 'if (Number.isNaN(Date.parse(process.argv[1]))) process.exit(1)' "$live_rendered_at"; then
              live_rendered_at=''
            fi
            verify_existing=0
            if [ "$live_sha" != "$revision" ] || [ "$live_snapshot" != "$expected_snapshot" ] || [ -z "$live_rendered_at" ]; then
              reason="official-source-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
              rendered_at=$(jq -er '.renderedAt' dist/render-context.json)
              expected_title="Deploy $revision / $reason"
              dispatched_at=$(date -u +%FT%TZ)
              gh workflow run deploy.yml --ref main -f reason="$reason" \
                -f publication_sha="$revision" -f rendered_at="$rendered_at"
              node scripts/watch-workflow.js --workflow deploy.yml --branch main \
                --title "$expected_title" --since "$dispatched_at"
            else
              echo "Publication already live at $revision" >> "$GITHUB_STEP_SUMMARY"
              verify_existing=1
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$revision" ]; then
              continue
            fi
            if VERIFY_EXISTING_RELEASE="$verify_existing" EXPECTED_RELEASE_SHA="$revision" node scripts/verify-release.js; then
              git fetch origin main
              if [ "$(git rev-parse origin/main)" = "$revision" ]; then
                verified=true
                break
              fi
            else
              git fetch origin main
              if [ "$(git rev-parse origin/main)" = "$revision" ]; then
                exit 1
              fi
            fi
          done
          if [ "$verified" != true ]; then
            echo '::error::Main kept advancing during deployment verification.'
            exit 1
          fi

      - name: Summarize source health
        if: always()
        shell: bash
        run: |
          if [ -f collector-report.json ]; then
            jq -r '.sources[] | "- \(.id): \(if .ok then "OK (\(.itemCount) links, \(.datedItems // 0) dated, \(.metadataFailures // 0) metadata fetch failures)" else "FAILED: \(.error)" end)"' collector-report.json >> "$GITHUB_STEP_SUMMARY"
            failed=$(jq '[.sources[] | select(.ok == false)] | length' collector-report.json)
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed source(s) failed; last-known-good records retained. See source-health artifact."
            fi
          fi

      - name: Save source-health report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-health-${{ github.run_id }}
          path: collector-report.json
          if-no-files-found: warn
          retention-days: 14
