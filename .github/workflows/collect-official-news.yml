name: Collect official sources (autonomous)

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Approved source ID, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch without committing to main
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'schedule' && 'write' || (inputs.dry_run && 'dry-run' || 'write') }}
      SOURCE: ${{ inputs.source || 'all' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect from approved official sources
        shell: bash
        run: |
          args=(--dry-run)
          if [ "$MODE" = "write" ]; then
            args=(--write)
          fi
          if [ "$SOURCE" != "all" ]; then
            args+=(--source "$SOURCE")
          fi
          npm run content:collect -- "${args[@]}"

      - name: Run content integrity audit
        run: npm run content:audit

      - name: Run collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Detect discovery changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated/discovery.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit discovery to main
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stcatharinesdigital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/discovery.json
          git commit -m "news: autonomous official-source refresh $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main -f reason=official-source-refresh
