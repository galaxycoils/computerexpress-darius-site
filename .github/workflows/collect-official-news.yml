name: Collect official source candidates

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Approved source ID, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch and validate without opening a review pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'schedule' && 'write' || (inputs.dry_run && 'dry-run' || 'write') }}
      SOURCE: ${{ inputs.source || 'all' }}
      REVIEW_BRANCH: automation/official-source-discovery
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect candidates from approved sources
        shell: bash
        run: |
          args=(--dry-run)
          if [ "$MODE" = "write" ]; then
            args=(--write)
          fi
          if [ "$SOURCE" != "all" ]; then
            args+=(--source "$SOURCE")
          fi
          npm run content:collect -- "${args[@]}"

      - name: Run content integrity audit
        run: npm run content:audit

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Detect snapshot changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated/discovery.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the managed review branch
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "stcatharinesdigital-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$REVIEW_BRANCH" || true
          remote_sha="$(git rev-parse "origin/$REVIEW_BRANCH" 2>/dev/null || true)"
          git checkout -B "$REVIEW_BRANCH"
          git add src/data/generated/discovery.json
          git commit -m "chore(content): refresh official source candidates"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$REVIEW_BRANCH:$remote_sha" origin "HEAD:$REVIEW_BRANCH"
          else
            git push -u origin "HEAD:$REVIEW_BRANCH"
          fi

      - name: Open or update the editorial review pull request
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          existing="$(gh pr list --base main --head "$REVIEW_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create               --base main               --head "$REVIEW_BRANCH"               --title "Editorial review: official source candidates"               --body "Automated discovery from the approved source registry. Every item remains a review candidate; this pull request does not publish articles automatically. Verify titles, dates, context, relevance, and source links before merging."
          else
            echo "Updated existing review pull request #$existing"
          fi
