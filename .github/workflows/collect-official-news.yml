name: Collect official sources (autonomous)

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-official-news.js
      - src/data/sourceRegistry.js
      - .github/workflows/collect-official-news.yml
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Approved source ID, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch without proposing a publication
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ github.event_name == 'schedule' && 'write' || (inputs.dry_run && 'dry-run' || 'write') }}
      SOURCE: ${{ inputs.source || 'all' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect from approved official sources
        shell: bash
        run: |
          args=(--dry-run)
          if [ "$MODE" = "write" ]; then
            args=(--write)
          fi
          if [ "$SOURCE" != "all" ]; then
            args+=(--source "$SOURCE")
          fi
          npm run content:collect -- "${args[@]}"

      - name: Run content integrity audit
        run: npm run content:audit

      - name: Run collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Validate application before publication
        if: env.MODE == 'write'
        run: |
          npm test
          npm run build
          npm run audit:schema

      - name: Detect discovery changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated/discovery.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify candidate before publishing discovery update
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stcatharinesdigital-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="news/official-source-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add src/data/generated/discovery.json
          git commit -m "news: autonomous official-source refresh $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin "HEAD:refs/heads/$branch"
          # GitHub Actions cannot open pull requests in this repository.
          # workflow_dispatch runs both independent quality gates on the
          # candidate branch before a fast-forward publish to main.
          candidate=$(git rev-parse HEAD)
          for workflow in ci.yml content-integrity.yml; do
            gh workflow run "$workflow" --ref "$branch"
            run_id=''
            for attempt in {1..30}; do
              run_id=$(gh run list --workflow "$workflow" --branch "$branch" \
                --event workflow_dispatch --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$candidate\") | .databaseId" | head -n 1)
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done
            if [ -z "$run_id" ]; then
              echo "::error::No $workflow run started for $candidate"
              exit 1
            fi
            gh run watch "$run_id" --exit-status
          done
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo '::error::Main advanced during validation. A fresh collection is required.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/main"
          git push origin --delete "$branch" || echo "::warning::Could not remove candidate branch $branch"

      - name: Ensure the latest snapshot is public
        if: env.MODE == 'write'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          revision=$(git rev-parse origin/main)
          # Also repair a prior failed deployment on a no-change collection.
          live=$(curl --fail --silent --show-error --max-time 20 "https://stcatharinesdigital.ca/release.json?collector=$GITHUB_RUN_ID" | jq -r '.sha // empty') || live=''
          if [ "$live" != "$revision" ]; then
            gh workflow run deploy.yml --ref main -f reason=official-source-refresh -f publication_sha="$revision"
            echo "Requested deployment of $revision" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publication already live at $revision" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize source health
        if: always()
        shell: bash
        run: |
          if [ -f collector-report.json ]; then
            jq -r '.sources[] | "- \(.id): \(if .ok then "OK (\(.itemCount) links, \(.datedItems // 0) dated, \(.metadataFailures // 0) metadata fetch failures)" else "FAILED: \(.error)" end)"' collector-report.json >> "$GITHUB_STEP_SUMMARY"
            failed=$(jq '[.sources[] | select(.ok == false)] | length' collector-report.json)
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed source(s) failed; last-known-good records retained. See source-health artifact."
            fi
          fi

      - name: Save source-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: collector-report.json
          if-no-files-found: warn
          retention-days: 14
