name: Collect official sources (autonomous)

on:
  push:
    branches: [main]
    paths:
      - scripts/collect-official-news.js
      - src/data/sourceRegistry.js
      - .github/workflows/collect-official-news.yml
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Approved source ID, or all
        required: true
        default: all
        type: string
      dry_run:
        description: Fetch without committing to main
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'schedule' && 'write' || (inputs.dry_run && 'dry-run' || 'write') }}
      SOURCE: ${{ inputs.source || 'all' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect from approved official sources
        shell: bash
        run: |
          args=(--dry-run)
          if [ "$MODE" = "write" ]; then
            args=(--write)
          fi
          if [ "$SOURCE" != "all" ]; then
            args+=(--source "$SOURCE")
          fi
          npm run content:collect -- "${args[@]}"

      - name: Run content integrity audit
        run: npm run content:audit

      - name: Run collector regression tests
        run: node --test scripts/*.regression.mjs

      - name: Detect discovery changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/data/generated/discovery.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit discovery to main
        if: env.MODE == 'write' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stcatharinesdigital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/discovery.json
          git commit -m "news: autonomous official-source refresh $(date -u +%Y-%m-%d)"
          # A human or another workflow may have advanced main during collection.
          # Rebase only cleanly; a conflicting snapshot requires a fresh run.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done

      - name: Ensure the latest snapshot is public
        if: env.MODE == 'write'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          revision=$(git rev-parse origin/main)
          # Also repair a prior failed deployment on a no-change collection.
          live=$(curl --fail --silent --show-error --max-time 20 "https://stcatharinesdigital.ca/release.json?collector=$GITHUB_RUN_ID" | jq -r '.sha // empty') || live=''
          if [ "$live" != "$revision" ]; then
            gh workflow run deploy.yml --ref main -f reason=official-source-refresh -f publication_sha="$revision"
            echo "Requested deployment of $revision" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publication already live at $revision" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize source health
        if: always()
        shell: bash
        run: |
          if [ -f collector-report.json ]; then
            jq -r '.sources[] | "- \(.id): \(if .ok then "OK (\(.itemCount) links, \(.datedItems // 0) dated, \(.metadataFailures // 0) metadata fetch failures)" else "FAILED: \(.error)" end)"' collector-report.json >> "$GITHUB_STEP_SUMMARY"
            failed=$(jq '[.sources[] | select(.ok == false)] | length' collector-report.json)
            if [ "$failed" -gt 0 ]; then
              echo "::warning::$failed source(s) failed; last-known-good records retained. See source-health artifact."
            fi
          fi

      - name: Save source-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: collector-report.json
          if-no-files-found: warn
          retention-days: 14
