<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">ComputerExpress — AI-First Web Design &amp; Local SEO</title>
  <desc id="ogDesc">Open Graph card for ComputerExpress</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1b"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12d6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12d6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <circle cx="950" cy="120" r="200" fill="#12d6ff" opacity="0.06"/>
  <circle cx="200" cy="520" r="250" fill="#a78bfa" opacity="0.05"/>
  <circle cx="600" cy="315" r="300" fill="url(#glow)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#7df9ff" stroke-opacity="0.03"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#7df9ff" stroke-opacity="0.03"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#7df9ff" stroke-opacity="0.03"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#7df9ff" stroke-opacity="0.03"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="url(#accent)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#0d1b30" stroke="#7df9ff" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M112 112c0-13.255 10.745-24 24-24h20v10h-20c-7.732 0-14 6.268-14 14s6.268 14 14 14h20v10h-20c-13.255 0-24-10.745-24-24z" fill="url(#accent)"/>
  <path d="M142 102h24v8h-24zM142 122h24v8h-24z" fill="#d8ffff"/>

  <!-- Brand name -->
  <text x="160" y="120" fill="#ecf5ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">ComputerExpress</text>

  <!-- Main headline -->
  <text x="80" y="260" fill="#ecf5ff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">Websites that look</text>
  <text x="80" y="330" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">premium</text>
  <text x="480" y="330" fill="#ecf5ff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">,</text>
  <text x="80" y="400" fill="#ecf5ff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">rank cleanly, and</text>
  <text x="80" y="470" fill="url(#accent)" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">convert</text>
  <text x="340" y="470" fill="#ecf5ff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">with intent.</text>

  <!-- Subheadline -->
  <text x="80" y="540" fill="#8899b8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">AI-first web design + technical SEO + local growth for service businesses</text>

  <!-- Right side: decorative browser mockup -->
  <g transform="translate(780, 140)">
    <rect width="340" height="220" rx="12" fill="#0d1b30" stroke="#7df9ff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect width="340" height="36" rx="12" fill="#0f1c35"/>
    <rect y="24" width="340" height="12" fill="#0f1c35"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="52" cy="18" r="5" fill="#28c840"/>
    <rect x="80" y="8" width="180" height="20" rx="10" fill="#0a1628" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="170" y="22" text-anchor="middle" fill="#5a7094" font-family="Inter, Arial, sans-serif" font-size="10">computerexpress.pages.dev</text>
    <!-- Content mockup -->
    <rect x="20" y="52" width="140" height="6" rx="3" fill="#12d6ff" opacity="0.5"/>
    <rect x="20" y="66" width="220" height="10" rx="3" fill="#ecf5ff" opacity="0.8"/>
    <rect x="20" y="82" width="180" height="10" rx="3" fill="#ecf5ff" opacity="0.4"/>
    <rect x="20" y="106" width="80" height="24" rx="5" fill="#12d6ff" opacity="0.7"/>
    <rect x="110" y="106" width="80" height="24" rx="5" stroke="#7df9ff" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <!-- Card grid -->
    <rect x="20" y="148" width="90" height="52" rx="6" fill="#0f1c35" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="120" y="148" width="90" height="52" rx="6" fill="#0f1c35" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="220" y="148" width="90" height="52" rx="6" fill="#0f1c35" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="30" y="158" width="40" height="4" rx="2" fill="#12d6ff" opacity="0.3"/>
    <rect x="30" y="168" width="60" height="4" rx="2" fill="#7df9ff" opacity="0.15"/>
    <rect x="30" y="178" width="50" height="4" rx="2" fill="#7df9ff" opacity="0.08"/>
    <rect x="130" y="158" width="40" height="4" rx="2" fill="#a78bfa" opacity="0.3"/>
    <rect x="130" y="168" width="60" height="4" rx="2" fill="#7df9ff" opacity="0.15"/>
    <rect x="130" y="178" width="50" height="4" rx="2" fill="#7df9ff" opacity="0.08"/>
    <rect x="230" y="158" width="40" height="4" rx="2" fill="#34d399" opacity="0.3"/>
    <rect x="230" y="168" width="60" height="4" rx="2" fill="#7df9ff" opacity="0.15"/>
    <rect x="230" y="178" width="50" height="4" rx="2" fill="#7df9ff" opacity="0.08"/>
  </g>

  <!-- Floating badges -->
  <g transform="translate(820, 380)">
    <rect width="120" height="36" rx="18" fill="#0d1b30" stroke="#12d6ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="60" y="23" text-anchor="middle" fill="#7df9ff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">100 PageSpeed</text>
  </g>
  <g transform="translate(960, 400)">
    <rect width="110" height="36" rx="18" fill="#0d1b30" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="55" y="23" text-anchor="middle" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Top 3 Local</text>
  </g>
</svg>
