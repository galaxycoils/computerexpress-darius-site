<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>St. Catharines Digital | Municipal News, Council & Planning</title>
    <meta name="description" content="Independent local news from official sources. Council decisions, police releases, planning notices and municipal updates for St. Catharines, Welland and Thorold." />
    <meta name="theme-color" content="#f7f4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#172128" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the reader's theme before the first paint without changing SSR markup.
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('theme-v3') || localStorage.getItem('theme-v2') || 'system'; } catch (_) {}
        var dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Google tag (gtag.js): deferred until first interaction or a late fallback to protect mobile LCP. -->
    <script>
      window.__analyticsId = 'G-HDESV0NDX4';
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      (function () {
        var loaded = false;
        var interactionEvents = ['pointerdown', 'keydown', 'scroll'];
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;

          interactionEvents.forEach(function (eventName) {
            window.removeEventListener(eventName, loadAnalytics, { passive: true });
          });

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.__analyticsId;
          document.head.appendChild(script);

          gtag('js', new Date());
          gtag('config', window.__analyticsId, { anonymize_ip: true });
        }

        window.__loadAnalytics = loadAnalytics;

        interactionEvents.forEach(function (eventName) {
          window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
        });

        window.setTimeout(loadAnalytics, 8000);
      })();
    </script>
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "source": "list",
            "urls": ["/council", "/police", "/planning-tracker"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
