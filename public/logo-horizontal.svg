<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" role="img" aria-labelledby="title desc">
  <title>St. Catharines Digital horizontal logo</title>
  <desc>St. Catharines Digital modern wordmark with cyber-blue icon and descriptive tagline.</desc>
  <defs>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Modern Geometric Icon -->
  <path d="M40 90 L80 20 L120 90 L80 160 Z" fill="url(#iconGradient)" opacity="0.9"/>
  <path d="M40 90 L80 60 L120 90 L80 120 Z" fill="#ffffff" opacity="0.3"/>
  
  <!-- Wordmark -->
  <text x="160" y="85" fill="url(#textGradient)" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">St. Catharines Digital</text>
  
  <!-- Tagline -->
  <text x="162" y="125" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0.5">High-Performance Web Design &amp; Local SEO</text>
</svg>
